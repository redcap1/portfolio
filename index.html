<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cut Room Portfolio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<style>
/* Layout: full-screen slides that snap one per scroll. Hero reel (ambient glow) → one slide per long-form work → shorts → stills → contact. Big section titles instead of rules. */
:root{
  --bg:#f7f7f6; --fg:#111213; --muted:#6b6e73; --line:#e1e2e3; --frame:#1a1c1f; --accent:#e5452f; --scrim:rgba(10,11,12,.55);
  --amb:.45;
  --display:"Archivo","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --pad:clamp(24px,3.4vw,52px); --head:72px; --nav:72px; --maxw:1480px;
  --side:max(var(--pad),calc((100vw - var(--maxw))/2));
  --avail:calc(100dvh - var(--top) - var(--pad) - var(--nav) - 12px);
  --top:calc(var(--pad) + var(--head) + 12px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f10;--fg:#ededec;--muted:#8d9096;--line:#25272a;--frame:#1c1e21;--accent:#ff6a52;--amb:.6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0f10;--fg:#ededec;--muted:#8d9096;--line:#25272a;--frame:#1c1e21;--accent:#ff6a52;--amb:.6;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;overflow:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.meta{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--muted);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}

/* one screen, content swaps in place */
.deck{position:fixed;inset:0;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:28px;overflow-y:auto;overflow-x:hidden;
  padding-inline:var(--side);padding-block:var(--top) calc(var(--pad) + var(--nav) + 12px);
  opacity:0;visibility:hidden;transform:translateX(48px);transition:opacity .45s ease,transform .5s cubic-bezier(.2,.7,.2,1),visibility 0s .5s}
.slide{scrollbar-width:none}.slide::-webkit-scrollbar{display:none}
.slide.prev{transform:translateX(-48px)}
.slide.cur{opacity:1;visibility:visible;transform:none;transition:opacity .45s ease,transform .5s cubic-bezier(.2,.7,.2,1),visibility 0s}

/* bottom bar: always-visible labelled menu */
.bar-nav{position:fixed;inset:auto 0 0 0;z-index:5;display:flex;align-items:center;justify-content:center;gap:10px;
  padding-inline:var(--side);padding-bottom:calc(env(safe-area-inset-bottom,0px) + var(--pad));pointer-events:none}
.bar-nav > *{pointer-events:auto}
/* menu reads like the player's highlight dots: one segment per page, label under it */
.bar-nav{background:linear-gradient(transparent,var(--bg) 40%);padding-top:36px}
.tabs{display:flex;gap:14px;flex:1;max-width:1180px;overflow-x:auto;scrollbar-width:none}
.tabs button{font:inherit;flex:1;min-width:max-content;display:grid;gap:8px;justify-items:start;padding:0;border:0;background:transparent;color:var(--muted);cursor:pointer;text-align:left}
.tabs button::before{content:"";width:100%;height:3px;border-radius:2px;background:var(--line);transition:background .25s}
.tabs button .n{font-family:var(--mono);font-size:11px;letter-spacing:.06em}
.tabs button .l{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:-.01em;line-height:1.1;margin-top:-4px}
.tabs button:hover{color:var(--fg)}
.tabs button:hover::before{background:var(--muted)}
.tabs button[aria-current="true"]{color:var(--fg)}
.tabs button[aria-current="true"]::before{background:var(--fg)}
.arrow{font:inherit;font-size:20px;width:44px;height:44px;flex:none;border-radius:50%;border:1.5px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer;transition:background .2s,color .2s}
.arrow:hover:not(:disabled){background:var(--fg);color:var(--bg)}
.arrow:disabled{opacity:.2;cursor:default}
.inner{width:100%;max-width:none;margin:0;display:grid;gap:28px}
.title{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.title h2{font-family:var(--display);font-weight:800;font-size:clamp(44px,8vw,112px);line-height:.92;letter-spacing:-.035em}
.title .meta{font-size:13px}

/* fixed header */
header{position:fixed;inset:0 0 auto 0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding-inline:var(--side);padding-top:calc(env(safe-area-inset-top,0px) + var(--pad));pointer-events:none}
header > *{pointer-events:auto}
.name{font-family:var(--display);font-weight:800;font-size:clamp(17px,1.6vw,22px);letter-spacing:-.01em}
.name-en{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.me{position:relative;display:flex;align-items:center;gap:14px}
.who{display:grid;text-align:right;line-height:1.3}
.avatar{width:clamp(52px,4.6vw,68px);height:clamp(52px,4.6vw,68px);border-radius:50%;padding:0;border:2px solid var(--fg);background:var(--frame);color:#fff;overflow:hidden;cursor:zoom-in;display:grid;place-items:center;font:inherit;font-size:13px;transition:transform .25s}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar:hover,.avatar[aria-expanded="true"]{transform:scale(1.08)}
.resume{position:absolute;right:0;top:calc(100% + 12px);width:min(440px,calc(100vw - 40px));max-height:80vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 24px 70px rgba(0,0,0,.3);z-index:20;transform-origin:top right;animation:pop .22s ease-out}
.resume img{display:block;width:100%;height:auto}
.resume-ph{aspect-ratio:1/1.414;display:grid;place-content:center;gap:8px;text-align:center;padding:24px;color:var(--muted)}
.resume-ph b{font-family:var(--display);font-size:28px;color:var(--fg)}
@keyframes pop{from{opacity:0;transform:scale(.92)}}


/* player */
.player{position:relative;display:block;width:100%;aspect-ratio:16/9;background:var(--frame);overflow:hidden;border-radius:4px;isolation:isolate}
.player img,.player video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.player video{opacity:0;transition:opacity .35s}
.player.on video{opacity:1}
.player .bar{position:absolute;inset:auto 0 0 0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;flex-wrap:wrap}
.player .info{font-family:var(--mono);font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.dots{display:flex;gap:4px;margin-top:6px}
.dots i{width:16px;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}
.dots i.cur{background:#fff}
.ctrls{display:flex;gap:8px}
.pbtn{font:inherit;font-size:13px;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 14px;cursor:pointer;backdrop-filter:blur(6px)}
.pbtn:hover{background:rgba(255,255,255,.28)}
.pbtn.full{background:#fff;color:#111;border-color:#fff}

/* hero */
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,64px);line-height:1.02;letter-spacing:-.025em;max-width:18ch}
.stage{position:relative;width:min(100%,calc((var(--avail) - 215px)*16/9));min-width:min(100%,320px)}
.stage canvas{position:absolute;inset:-8% -6%;width:112%;height:116%;filter:blur(70px) saturate(1.5);opacity:var(--amb);z-index:0;pointer-events:none}
.stage .player{z-index:1}
.hero-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;position:relative;z-index:1}

/* long-form slide */
/* long-form: one slide, pick a work from the list */
.wlist{display:grid;gap:6px;margin-top:18px}
.wlist button{font:inherit;text-align:left;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:baseline;padding:8px 0;border:0;border-top:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.wlist button .n{font-family:var(--mono);font-size:11px}
.wlist button .t{font-weight:600;font-size:15px}
.wlist button .d{font-family:var(--mono);font-size:11px}
.wlist button:hover,.wlist button[aria-current="true"]{color:var(--fg)}
.wlist button[aria-current="true"] .t{text-decoration:underline;text-underline-offset:4px}
.player.reel .dots{display:none}
/* graphics & motion grid: images, GIF/WebP and short looping videos */
.gfx{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;width:min(100%,calc((var(--avail) - 150px)*2.2))}
.gi{margin:0;display:grid;gap:6px;min-width:0}
.gi .frame{position:relative;aspect-ratio:var(--ar,4/3);overflow:hidden;background:var(--frame);border-radius:4px}
.gi img,.gi video{position:absolute;inset:0;width:100%;height:100%;object-fit:var(--fit,cover)}
.gi .badge{position:absolute;left:8px;top:8px;color:#fff;font-family:var(--mono);font-size:10px;letter-spacing:.08em;background:rgba(0,0,0,.5);padding:1px 6px;border-radius:3px}
.lf{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:32px;align-items:end}
.lf .pwrap{width:min(100%,calc((var(--avail) - 150px)*16/9))}
.lf h3{font-size:clamp(22px,2.4vw,30px);font-weight:600;line-height:1.25;margin:4px 0 6px}
.lf p{margin:10px 0 0;color:var(--muted);font-size:15px;max-width:40ch}
.roles{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.roles span{font-family:var(--mono);font-size:11px;border:1px solid var(--line);padding:2px 8px;border-radius:999px}

/* shorts */
.shorts-empty{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;width:min(100%,calc((var(--avail) - 190px)*2.6))}
.shorts-empty div{aspect-ratio:9/16;border:1px dashed var(--line);border-radius:2px;display:grid;place-items:center;color:var(--muted);font-family:var(--mono);font-size:11px}
.shorts-note{margin:0;font-size:14px;color:var(--muted)}

/* stills */
.stills{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;width:min(100%,calc((var(--avail) - 190px)*1.7))}
.st{grid-column:span 2;display:grid;gap:6px;margin:0;min-width:0}
.st.wide{grid-column:span 4}
.st .frame{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--frame);border-radius:2px}
.st img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
figcaption{font-size:13px;color:var(--muted)}

/* contact */
.end{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:end}
.end p{margin:0;max-width:46ch;font-size:18px}
.clients{margin-top:18px;color:var(--muted);font-size:14px}
.big{font-family:var(--display);font-weight:800;font-size:clamp(20px,2.6vw,34px);letter-spacing:-.02em;white-space:nowrap;user-select:all}
.clist{display:grid;gap:18px}
.ci{display:grid;grid-template-columns:72px minmax(0,1fr);gap:4px 14px;align-items:center}
.ci .k{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.ci .acts{grid-column:2;display:flex;gap:10px;flex-wrap:wrap}
.line-id{display:inline-block;background:#06C755;color:#fff;font-family:var(--display);font-weight:800;font-size:clamp(18px,2.2vw,28px);padding:2px 12px;border-radius:8px;user-select:all}
.theme-btn{font:inherit;font-size:12px;font-family:var(--mono);letter-spacing:.06em;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.theme-btn:hover{border-color:var(--fg)}
.hleft{display:flex;align-items:center;gap:16px}
.brand{display:grid;line-height:1.05}
.brand b{font-family:var(--display);font-weight:800;font-size:clamp(20px,2.2vw,30px);letter-spacing:-.02em}
.brand span{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:4px}
.avatar img{object-position:var(--focus,50% 35%);transform:scale(var(--zoom,1.6));transform-origin:var(--focus,50% 35%)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{font:inherit;font-size:14px;padding:8px 16px;border:1px solid var(--fg);background:transparent;color:var(--fg);border-radius:999px;cursor:pointer}
.btn:hover{background:var(--fg);color:var(--bg)}
.btn.solid{background:var(--fg);color:var(--bg)}
.links{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px;font-size:14px}
.links a{border-bottom:1px solid var(--line)} .links a:hover{border-color:var(--fg)}
.foot{position:absolute;left:var(--side);right:var(--side);bottom:calc(var(--pad) + var(--nav) + 4px);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* confirm panel */
.modal{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:20px;z-index:10}
.card{background:var(--bg);color:var(--fg);border-radius:10px;max-width:420px;width:100%;padding:26px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.card h3{font-size:20px;font-weight:600}
.card p{margin:0;color:var(--muted);font-size:15px}
.modal:has(.theater:not([hidden])){background:rgba(0,0,0,.92)}
.theater{width:min(100%,calc((100dvh - 120px)*16/9));display:grid;gap:12px}
.tv{position:relative;aspect-ratio:16/9;background:#000;border-radius:6px;overflow:hidden}
.tv iframe,.tv video{position:absolute;inset:0;width:100%;height:100%;border:0}

@media (max-width:780px){
  .big{white-space:normal;overflow-wrap:anywhere}
  .ci{grid-template-columns:1fr}.ci .acts{grid-column:1}
  :root{--pad:20px;--head:64px;--nav:64px}
  .slide{justify-content:flex-start}
  .lf,.end{grid-template-columns:1fr;gap:20px}
  .stage,.lf .pwrap,.stills,.shorts-empty{width:100%}
  .stills{grid-template-columns:1fr 1fr}
  .st,.st.wide{grid-column:span 2}
  .shorts-empty{grid-template-columns:repeat(3,1fr)}
  .shorts-empty div:nth-child(n+4){display:none}
  .stage canvas{filter:blur(40px) saturate(1.5)}
  .who .meta{display:none}
  .tabs{gap:10px}
  .tabs button .l{font-size:14px}
  .foot{position:static;margin-top:20px}
  .arrow{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.deck{scroll-behavior:auto}}
/* short-form clips */
.shorts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;width:min(100%,calc((var(--avail) - 190px)*2.6))}
.sf{display:grid;gap:8px;min-width:0}
.sfv{position:relative;display:block;aspect-ratio:9/16;background:var(--frame);border-radius:4px;overflow:hidden}
.sfv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sfv .stat{position:absolute;right:8px;top:8px;color:#fff;font-family:var(--mono);font-size:11px;background:rgba(0,0,0,.45);padding:1px 6px;border-radius:3px}
.sf > span:last-child{font-size:14px;font-weight:500}
</style>
</head>
<body>

<header>
  <div class="hleft"><span class="brand"><b id="pTopLabel"></b><span id="pTopSub"></span></span><button class="theme-btn" id="themeBtn" type="button"></button></div>
  <div class="me">
    <span class="who"><span class="name" id="pName"></span><span class="name-en" id="pNameEn"></span></span>
    <button class="avatar" id="avatar" type="button" aria-expanded="false" aria-controls="resume" aria-label="ดู Resume"></button>
    <div class="resume" id="resume" hidden></div>
  </div>
</header>

<nav class="bar-nav" aria-label="เมนู"><button class="arrow" id="prevBtn" type="button" aria-label="ก่อนหน้า">←</button><div class="tabs" id="tabs"></div><button class="arrow" id="nextBtn" type="button" aria-label="ถัดไป">→</button></nav>

<main class="deck" id="deck">
  <section class="slide hero" id="s-home" data-name="Showreel" data-tab="Showreel">
    <div class="inner">
      <h1 id="pHeadline"></h1>
      <div class="stage"><canvas id="amb" width="64" height="36" aria-hidden="true"></canvas><div id="heroPlayer"></div></div>
      <div class="hero-foot meta"><span id="pHeroL"></span><span id="pHeroR"></span></div>
    </div>
  </section>

  <section class="slide" id="s-long" data-name="Long-form" data-tab="Long-form">
    <div class="inner">
      <div class="title"><h2 id="tLong"></h2><span class="meta" id="tLongNote"></span></div>
      <div class="lf"><div class="pwrap"><div id="longPlayer"></div></div>
        <div><div id="longInfo"></div><div class="wlist" id="workList"></div></div></div>
    </div>
  </section>

  <section class="slide" id="s-short" data-name="Short-form" data-tab="Short-form">
    <div class="inner">
      <div class="title"><h2 id="tShort"></h2><span class="meta" id="tShortNote"></span></div>
      <div id="shortList"></div>
    </div>
  </section>

  <section class="slide" id="s-stills" data-name="Stills" data-tab="Stills">
    <div class="inner">
      <div class="title"><h2 id="tStills"></h2><span class="meta" id="stillsNote"></span></div>
      <div class="stills" id="stillList"></div>
    </div>
  </section>

  <section class="slide" id="s-graphics" data-name="Graphics" data-tab="Graphics">
    <div class="inner">
      <div class="title"><h2 id="tGfx"></h2><span class="meta" id="tGfxNote"></span></div>
      <div id="gfxList"></div>
    </div>
  </section>

  <section class="slide" id="s-contact" data-name="ติดต่อ" data-tab="ติดต่อ">
    <div class="inner">
      <div class="title"><h2 id="tContact"></h2><span class="meta" id="tContactNote"></span></div>
      <div class="end">
        <div>
          <p id="pAbout"></p>
          <div class="clients" id="pClients"></div>
        </div>
        <div>
          <div class="clist">
            <div class="ci"><span class="k">Email</span><span class="big" id="mail"></span>
              <span class="acts"><button class="btn" id="copy" type="button">คัดลอกอีเมล</button></span></div>
            <div class="ci" id="lineRow"><span class="k">LINE</span><span><span class="line-id" id="pLine"></span></span>
              <span class="acts"><button class="btn" id="copyLine" type="button">คัดลอก LINE ID</button></span></div>
            <div class="ci"><span class="k">Links</span><div class="links" id="pLinks"></div></div>
          </div>
        </div>
      </div>
    </div>
    <div class="foot meta"><span id="pCopy"></span><button class="btn" type="button" onclick="goTo(0)">กลับหน้าแรก</button></div>
  </section>
</main>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="card">
    <span class="meta" id="mMeta"></span>
    <h3 id="mTitle"></h3>
    <p id="mNote"></p>
    <div class="row" style="margin:0"><button class="btn solid" id="mGo" type="button">ดูคลิปเต็ม</button><button class="btn" id="mClose" type="button">ดูไฮไลท์ต่อ</button></div>
  </div>
  <div class="theater" id="theater" hidden>
    <div class="tv" id="tv"></div>
    <div class="row" style="margin:0;justify-content:space-between"><span class="meta" id="tvTitle" style="color:#ddd"></span><button class="btn solid" id="tvClose" type="button">ปิด ✕</button></div>
  </div>
</div>

<!-- all text, works, shorts and stills live in content.js — edit that file, not this one -->
<script src="content.js"></script>
<script>
const C=window.CONTENT||{},P=C.profile||{};
const WORKS=C.works||[],SHORTS=C.shorts||[],STILLS=C.stills||[];
const YT_FALLBACK=C.youtubeFallback||"https://www.youtube.com";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const touch=matchMedia("(hover: none)").matches;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const players=[];
const deck=$("deck");

// profile text
document.title=(P.name?P.name+" — ":"")+"Video Editor";
$("pName").textContent=P.nameTh||P.name||"";
$("pHeadline").textContent=P.headline||"";
$("pHeroL").textContent=P.heroLeft||"";$("pHeroR").textContent=P.heroRight||"";
$("pAbout").textContent=P.about||"";$("pClients").textContent=P.clients||"";
$("mail").textContent=P.email||"";$("pLine").textContent=P.line||"";if(!P.line)$("lineRow").hidden=true;
// section titles and menu names (editable in content.js → "sections")
const T=Object.assign({topLabel:"Video Editor",topSub:"Portfolio 2026",tabShowreel:"Showreel",long:"Long-form",longNote:"เลือกงานจากรายการ",tabLong:"Long-form",short:"Short-form",shortNote:"9:16 · Reels / TikTok / Shorts",tabShort:"Short-form",stills:"ภาพนิ่ง",stillsNote:"",tabStills:"ภาพนิ่ง",graphics:"Graphics & Motion",graphicsNote:"กราฟิก · โมชั่น",tabGraphics:"กราฟิก & โมชั่น",contact:"Contact",contactNote:"รับงานใหม่",tabContact:"ติดต่อ"},C.sections||{});
$("pTopLabel").textContent=T.topLabel;$("pTopSub").textContent=T.topSub||"";
$("tShort").textContent=T.short;$("tShortNote").textContent=T.shortNote;$("tStills").textContent=T.stills;
$("tContact").textContent=T.contact;$("tContactNote").textContent=T.contactNote;
$("s-home").dataset.tab=T.tabShowreel;$("s-long").dataset.tab=T.tabLong;$("s-graphics").dataset.tab=T.tabGraphics;$("tLong").textContent=T.long;$("tLongNote").textContent=T.longNote;$("tGfx").textContent=T.graphics;$("tGfxNote").textContent=T.graphicsNote;$("s-short").dataset.tab=T.tabShort;$("s-stills").dataset.tab=T.tabStills;$("s-contact").dataset.tab=T.tabContact;
// theme: content.js "theme" is the default; the button remembers the viewer's choice
const rootEl=document.documentElement;
let theme=(()=>{try{return localStorage.getItem("theme")}catch(e){return null}})()||C.theme||"dark";
function applyTheme(){rootEl.dataset.theme=theme;$("themeBtn").textContent=theme==="dark"?"☀ สว่าง":"☾ มืด";$("themeBtn").setAttribute("aria-label",theme==="dark"?"เปลี่ยนเป็นธีมสว่าง":"เปลี่ยนเป็นธีมมืด")}
$("themeBtn").onclick=()=>{theme=theme==="dark"?"light":"dark";try{localStorage.setItem("theme",theme)}catch(e){}applyTheme()};
applyTheme();
$("pLinks").innerHTML=(P.links||[]).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("");
$("pCopy").textContent="© "+new Date().getFullYear()+" "+(P.name||"");
$("stillsNote").textContent=C.stillsNote||T.stillsNote||"";
$("avatar").innerHTML=P.photo?`<img src="${esc(P.photo)}" alt="">`:`<span>${esc((P.nameTh||P.name||"?").slice(0,3))}</span>`;
$("resume").innerHTML=P.resume?`<img src="${esc(P.resume)}" alt="Resume">`:`<div class="resume-ph"><b>Resume</b><span>ยังไม่ได้ใส่ไฟล์ resume ใน content.js</span></div>`;
$("pNameEn").textContent=P.nameTh?(P.name||""):"";
if(P.photoFocus)$("avatar").style.setProperty("--focus",P.photoFocus);if(P.photoZoom)$("avatar").style.setProperty("--zoom",P.photoZoom);
$("avatar").title=P.resume?"ดู Resume":"";

// confirm panel, then the full video plays in-page:
// YouTube embed when online (yt = video id) → local file (file, for the offline folder) → new tab (url) as last resort
const modal=$("modal"),card=modal.querySelector(".card"),theater=$("theater"),tv=$("tv");
let lastFocus=null,resumeAfter=null,curWork=null;
const fullSource=w=>w.yt&&navigator.onLine?"yt":w.file?"file":"link";
function askFull(w,p){
  lastFocus=document.activeElement;curWork=w;
  $("mTitle").textContent=w.title;
  $("mMeta").textContent=`${w.type} · ยาว ${w.length}`;
  $("mNote").textContent=fullSource(w)==="link"?"คลิปเต็มจะเปิดบน YouTube ในแท็บใหม่":"คลิปเต็มเล่นในหน้านี้ ปิดแล้วกลับมาดูไฮไลท์ต่อได้";
  players.forEach(x=>x.pause());resumeAfter=p;
  card.hidden=false;theater.hidden=true;modal.hidden=false;$("mGo").focus();
}
function playFull(){
  const w=curWork,src=fullSource(w);
  if(src==="link"){window.open(w.url||YT_FALLBACK,"_blank","noopener");closeModal();return}
  tv.innerHTML=src==="yt"
    ?`<iframe src="https://www.youtube-nocookie.com/embed/${esc(w.yt)}?autoplay=1&rel=0&modestbranding=1" title="${esc(w.title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`
    :`<video src="${esc(w.file)}" poster="${esc(w.poster)}" controls autoplay playsinline></video>`;
  $("tvTitle").textContent=`${w.title} · ${w.length}`;
  card.hidden=true;theater.hidden=false;$("tvClose").focus();
}
function closeModal(){tv.innerHTML="";modal.hidden=true;if(resumeAfter&&resumeAfter.wanted)resumeAfter.play();lastFocus&&lastFocus.focus()}
$("mClose").onclick=closeModal;$("tvClose").onclick=closeModal;$("mGo").onclick=playFull;
modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});

// highlight player: plays the work's clips in a random order, never the full video
function makePlayer(host,w,reel){
  const order=reel?[w.src]:shuffle(w.clips||[]);let i=0;
  host.className="player"+(reel?" reel":"");
  host.innerHTML=`<img src="${esc(w.poster)}" alt=""><video muted playsinline preload="none"></video>
   <div class="bar"><div class="info"><span class="lbl"></span><div class="dots">${order.map(()=>"<i></i>").join("")}</div></div>
   <div class="ctrls"><button class="pbtn snd" type="button" aria-pressed="false">เปิดเสียง</button><button class="pbtn full" type="button">${reel?"เต็มจอ":"ดูคลิปเต็ม"}</button></div></div>`;
  const v=host.querySelector("video"),lbl=host.querySelector(".lbl"),dots=host.querySelectorAll(".dots i"),snd=host.querySelector(".snd");
  const p={v,wanted:false,
    load(){if(!order.length)return;v.src=order[i];lbl.textContent=reel?`${w.title||"Showreel"} · ${w.length||""}`:`ไฮไลท์ ${i+1}/${order.length} · คลิปเต็ม ${w.length}`;dots.forEach((d,k)=>d.classList.toggle("cur",k===i))},
    play(){if(reduce||!order.length)return;p.wanted=true;v.play().then(()=>host.classList.add("on")).catch(()=>{})},
    pause(){v.pause()},
    stop(){p.wanted=false;v.pause()}};
  v.addEventListener("ended",()=>{i=(i+1)%order.length;p.load();if(p.wanted)v.play().catch(()=>{})});
  snd.onclick=()=>{v.muted=!v.muted;snd.textContent=v.muted?"เปิดเสียง":"ปิดเสียง";snd.setAttribute("aria-pressed",String(!v.muted));if(!v.muted)p.play()};
  host.querySelector(".full").onclick=()=>{if(!reel)return askFull(w,p);(v.requestFullscreen||v.webkitRequestFullscreen||(()=>{})).call(v);v.muted=false;snd.textContent="ปิดเสียง";p.play()};
  if(reel)v.loop=true;
  p.load();players.push(p);
  p.destroy=()=>{p.stop();v.removeAttribute("src");v.load();const k=players.indexOf(p);if(k>=0)players.splice(k,1)};
  return p;
}

// hero = showreel (falls back to the first work), with the ambient glow (current frame drawn small, blurred by CSS)
const slidePlayers=new Map();
const REEL=C.showreel&&C.showreel.src?C.showreel:null;
if(REEL||WORKS.length){
  const hero=REEL?makePlayer($("heroPlayer"),REEL,true):makePlayer($("heroPlayer"),WORKS[0]);
  hero.v.preload="auto";slidePlayers.set($("s-home"),hero);
  const amb=$("amb"),ctx=amb.getContext("2d");
  (function glow(){
    if(hero.v.readyState>=2){try{ctx.drawImage(hero.v,0,0,amb.width,amb.height)}catch(e){}}
    else{const im=document.querySelector("#heroPlayer img");if(im&&im.complete&&im.naturalWidth)ctx.drawImage(im,0,0,amb.width,amb.height)}
    if(!reduce)requestAnimationFrame(glow);
  })();
}

// long-form: one slide; the list beside the player switches which work is showing
let longP=null;
function showWork(k){
  const w=WORKS[k];if(!w)return;
  const wasOn=longP&&longP.wanted;if(longP)longP.destroy();
  longP=makePlayer($("longPlayer"),w);
  $("longInfo").innerHTML=`<span class="meta">${esc(w.type)} · ${esc(w.year)}</span><h3>${esc(w.title)}</h3><p>${esc(w.desc)}</p>
   <div class="roles">${(w.roles||[]).map(r=>`<span>${esc(r)}</span>`).join("")}</div>`;
  [...$("workList").children].forEach((b,i)=>b.setAttribute("aria-current",String(i===k)));
  if(wasOn)longP.play();
}
$("workList").innerHTML=WORKS.map((w,k)=>`<button type="button" data-k="${k}"><span class="n">${String(k+1).padStart(2,"0")}</span><span class="t">${esc(w.tab||w.title)}</span><span class="d">${esc(w.length)}</span></button>`).join("");
$("workList").onclick=e=>{const b=e.target.closest("button");if(b){showWork(+b.dataset.k);longP.play()}};
if(WORKS.length)showWork(0);
slidePlayers.set($("s-long"),{get wanted(){return !!(longP&&longP.wanted)},play(){longP&&longP.play()},stop(){longP&&longP.stop()}});

// short-form: vertical clips that loop while their slide is open
const shortVideos=[];
$("shortList").innerHTML=SHORTS.length
  ?`<div class="shorts">${SHORTS.map(w=>`<a class="sf"${w.url?` href="${esc(w.url)}" target="_blank" rel="noopener"`:""}><span class="sfv"><video src="${esc(w.clip)}" poster="${esc(w.poster)}" muted loop playsinline preload="none"></video>${w.platform?`<span class="stat">${esc(w.platform)}</span>`:""}</span><span>${esc(w.title)}</span></a>`).join("")}</div>`
  :`<div class="shorts-empty" aria-hidden="true"><div>9:16</div><div>9:16</div><div>9:16</div><div>9:16</div><div>9:16</div></div><p class="shorts-note">ยังไม่มีคลิปแนวตั้ง</p>`;
document.querySelectorAll("#shortList video").forEach(v=>shortVideos.push(v));
slidePlayers.set($("s-short"),{play(){if(!reduce)shortVideos.forEach(v=>v.play().catch(()=>{}))},stop(){shortVideos.forEach(v=>v.pause())}});

$("stillList").innerHTML=STILLS.map(w=>`
 <figure class="st${w.wide?" wide":""}"><div class="frame"><img src="${esc(w.src)}" alt="${esc(w.title)}" loading="lazy"></div><figcaption>${esc(w.title)}</figcaption></figure>`).join("");

// graphics & motion: still images, animated GIF/WebP, and short looping MP4/WebM
const GFX=C.graphics||[],gfxVideos=[];
const isVid=f=>/\.(mp4|webm|mov)$/i.test(f||""),isAnim=f=>/\.(gif|webp)$/i.test(f||"");
$("gfxList").innerHTML=GFX.length
  ?`<div class="gfx">${GFX.map(g=>`<figure class="gi"><div class="frame" style="--ar:${esc(g.ratio||"4/3")};--fit:${g.fit==="contain"?"contain":"cover"}">${isVid(g.src)
      ?`<video src="${esc(g.src)}" poster="${esc(g.poster||"")}" muted loop playsinline preload="none"></video><span class="badge">MOTION</span>`
      :`<img src="${esc(g.src)}" alt="${esc(g.title)}" loading="lazy">${isAnim(g.src)?'<span class="badge">ANIMATED</span>':""}`}</div><figcaption>${esc(g.title)}</figcaption></figure>`).join("")}</div>`
  :`<p class="shorts-note">ยังไม่มีผลงานกราฟิกหรือโมชั่น — เพิ่มด้วย เพิ่มงาน.bat หรือใส่ใน content.js ส่วน "graphics"</p>`;
document.querySelectorAll("#gfxList video").forEach(v=>gfxVideos.push(v));
slidePlayers.set($("s-graphics"),{play(){if(!reduce)gfxVideos.forEach(v=>v.play().catch(()=>{}))},stop(){gfxVideos.forEach(v=>v.pause())}});

// one screen: only the current slide is shown; menu, arrows, keys, wheel and swipe swap it
const slides=[...document.querySelectorAll(".slide")];
const tabs=$("tabs"),prevBtn=$("prevBtn"),nextBtn=$("nextBtn");
tabs.innerHTML=slides.map((s,k)=>`<button type="button" data-k="${k}"><span class="n">${String(k+1).padStart(2,"0")}</span><span class="l">${esc(s.dataset.tab)}</span></button>`).join("");
let cur=-1,lock=false;
function goTo(n){
  n=Math.max(0,Math.min(slides.length-1,n));if(n===cur)return;
  slides.forEach((s,k)=>{s.classList.toggle("cur",k===n);s.classList.toggle("prev",k<n);s.setAttribute("aria-hidden",String(k!==n));s.inert=k!==n});
  slidePlayers.forEach((p,s)=>s===slides[n]?(modal.hidden&&p.play()):p.stop());
  [...tabs.children].forEach((b,k)=>b.setAttribute("aria-current",String(k===n)));
  tabs.children[n].scrollIntoView({block:"nearest",inline:"center"});
  prevBtn.disabled=n===0;nextBtn.disabled=n===slides.length-1;
  slides[n].scrollTop=0;deck.scrollLeft=0;deck.scrollTop=0;cur=n;
  try{history.replaceState(null,"","#"+slides[n].id)}catch(e){}
}
tabs.addEventListener("click",e=>{const b=e.target.closest("button");if(b)goTo(+b.dataset.k)});
// the deck never scrolls itself (anchor jumps would shift the whole screen sideways)
deck.addEventListener("scroll",()=>{deck.scrollLeft=0;deck.scrollTop=0});
prevBtn.onclick=()=>goTo(cur-1);nextBtn.onclick=()=>goTo(cur+1);
const step=d=>{if(lock)return;lock=true;goTo(cur+d);setTimeout(()=>lock=false,700)};
// wheel: one notch = one slide, unless the slide itself still has room to scroll (small screens)
deck.addEventListener("wheel",e=>{
  if(!modal.hidden||Math.abs(e.deltaY)<Math.abs(e.deltaX)&&Math.abs(e.deltaX)<20)return;
  const s=slides[cur],d=(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)>0?1:-1;
  const canScroll=d>0?s.scrollTop+s.clientHeight<s.scrollHeight-2:s.scrollTop>0;
  if(canScroll&&Math.abs(e.deltaX)<=Math.abs(e.deltaY))return;
  e.preventDefault();step(d);
},{passive:false});
// swipe left/right on touch screens
let sx=0,sy=0;
deck.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
deck.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)step(dx<0?1:-1)},{passive:true});
addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(!modal.hidden)closeModal();showRs(false);return}
  if(!modal.hidden||e.target.closest("input,textarea"))return;
  const d={ArrowRight:1,ArrowDown:1,PageDown:1,ArrowLeft:-1,ArrowUp:-1,PageUp:-1}[e.key];if(!d)return;
  e.preventDefault();step(d);
});
const start=slides.findIndex(s=>"#"+s.id===location.hash);
goTo(start<0?0:start);

// resume: hover the face (desktop) or tap it (touch); tapping elsewhere closes
const av=$("avatar"),rs=$("resume"),me=av.parentElement;
function showRs(o){rs.hidden=!o;av.setAttribute("aria-expanded",String(o))}
if(!touch){me.addEventListener("mouseenter",()=>showRs(true));me.addEventListener("mouseleave",()=>showRs(false))}
av.addEventListener("click",e=>{e.stopPropagation();showRs(rs.hidden)});
document.addEventListener("click",e=>{if(!me.contains(e.target))showRs(false)});

async function copyText(el,btn,done){
  try{await navigator.clipboard.writeText(el.textContent);btn.textContent=done}
  catch(err){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent="กด Ctrl+C เพื่อคัดลอก"}
}
$("copyLine").onclick=e=>copyText($("pLine"),e.target,"คัดลอกแล้ว");
$("copy").addEventListener("click",async e=>{
  const el=$("mail");
  try{await navigator.clipboard.writeText(el.textContent);e.target.textContent="คัดลอกแล้ว"}
  catch(err){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);e.target.textContent="กด Ctrl+C เพื่อคัดลอก"}
});
</script>
